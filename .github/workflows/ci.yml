name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps (test-only subset)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.110.0 "uvicorn[standard]==0.29.0" sqlalchemy==2.0.27 pydantic==2.6.1 pydantic-settings==2.1.0 "python-jose[cryptography]==3.3.0" "passlib[bcrypt]==1.7.4" bcrypt==4.0.1 python-multipart==0.0.9 psycopg2-binary==2.9.9 websockets==12.0 aiofiles==23.2.1 python-dotenv==1.0.1 email-validator==2.1.1 httpx==0.27.0 pytest==8.0.1 pytest-asyncio==0.23.5 anyio==4.3.0 numpy==2.2.6
      - name: Backend tests
        run: python -m pytest tests/ -q --tb=short
        env:
          # keep heavy/optional subsystems out of the CI import path check
          PYTHONPATH: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
