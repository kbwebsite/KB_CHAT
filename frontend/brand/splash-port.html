<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 1920px; overflow: hidden; background: #06060e;
    font-family: "Segoe UI", system-ui, sans-serif; }
  .stage { position: relative; width: 1280px; height: 1920px; overflow: hidden;
    background:
      radial-gradient(ellipse 700px 500px at 22% 12%, rgba(124,92,252,0.20), transparent 65%),
      radial-gradient(ellipse 620px 520px at 82% 88%, rgba(34,211,238,0.13), transparent 65%),
      radial-gradient(ellipse 560px 460px at 50% 55%, rgba(244,114,182,0.08), transparent 65%),
      #06060e; }
  .grid { position: absolute; inset: 0; opacity: 0.5;
    background-image: linear-gradient(rgba(124,92,252,0.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(124,92,252,0.07) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, black 30%, transparent 75%); }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb1 { width: 560px; height: 560px; top: -140px; right: -140px;
    background: radial-gradient(circle, rgba(124,92,252,0.35), transparent 70%); }
  .orb2 { width: 480px; height: 480px; bottom: 12%; left: -120px;
    background: radial-gradient(circle, rgba(34,211,238,0.22), transparent 70%); }
  .orb3 { width: 380px; height: 380px; bottom: -80px; right: 24%;
    background: radial-gradient(circle, rgba(244,114,182,0.20), transparent 70%); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .logo { width: 360px; height: 360px;
    filter: drop-shadow(0 24px 80px rgba(124,92,252,0.55)) drop-shadow(0 0 120px rgba(168,85,247,0.25)); }
  .name { margin-top: 56px; font-size: 118px; font-weight: 800; letter-spacing: 10px;
    color: #ffffff; text-indent: 10px; }
  .rule { margin-top: 28px; width: 300px; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, #7c5cfc, #a855f7, #22d3ee); }
  .tag { margin-top: 26px; font-size: 34px; font-weight: 600; letter-spacing: 12px;
    text-indent: 12px; color: rgba(240,240,255,0.55); }
  .foot { position: absolute; bottom: 96px; width: 100%; text-align: center;
    font-size: 26px; letter-spacing: 6px; color: rgba(240,240,255,0.30); }
</style></head>
<body><div class="stage">
  <div class="grid"></div>
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  <div class="center">
    <img class="logo" src="logo.svg" alt="">
    <div class="name">Kryzen</div>
    <div class="rule"></div>
    <div class="tag">CONNECT &bull; CHAT &bull; SHARE</div>
  </div>
  <div class="foot">FAST &bull; SECURE &bull; YOURS</div>
</div></body></html>
