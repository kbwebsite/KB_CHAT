<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="kz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#7c5cfc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="kz-spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="kz-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="kz-sheen" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle -->
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#kz-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#kz-sheen)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>

  <!-- chat bubble -->
  <g>
    <rect x="122" y="150" width="268" height="196" rx="58" fill="#ffffff"/>
    <path d="M168 336 L148 398 L224 342 Z" fill="#ffffff"/>
    <!-- spark (4-point star) -->
    <path d="M256 186 c3.4 27.6 13.8 38 41.4 41.4 -27.6 3.4 -38 13.8 -41.4 41.4 -3.4 -27.6 -13.8 -38 -41.4 -41.4 27.6 -3.4 38 -13.8 41.4 -41.4 z" fill="url(#kz-bg)"/>
    <!-- typing dots -->
    <circle cx="168" cy="252" r="13" fill="#7c5cfc"/>
    <circle cx="344" cy="252" r="13" fill="url(#kz-cyan)"/>
  </g>

  <!-- orbit accent -->
  <circle cx="398" cy="132" r="17" fill="url(#kz-cyan)"/>
  <circle cx="398" cy="132" r="26" fill="none" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="5"/>
</svg>
