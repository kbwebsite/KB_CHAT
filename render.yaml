services:
  - type: web
    name: kb-chat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://kb-chat-jqdk.onrender.com
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: mock
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 947604684664-sbjfl0jmj332b81fmqeu7dd3tsct94l2.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 947604684664-sbjfl0jmj332b81fmqeu7dd3tsct94l2.apps.googleusercontent.com
      - key: CLOUDINARY_CLOUD_NAME
        value: yz20bqni
      - key: CLOUDINARY_API_KEY
        value: 358381591648362
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Push notifications via Firebase. The web values below are PUBLIC
      # (they ship in the client bundle by design), same convention as
      # GOOGLE_CLIENT_ID above. Only the service-account JSON and the VAPID
      # key stay dashboard-managed (sync: false); without them push stays
      # disabled and the app is unaffected.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_API_KEY
        value: AIzaSyC1Nize-muh1wm3sp0sA25THF9jL-X-iLI
      - key: FIREBASE_PROJECT_ID
        value: kbwebsite-s
      - key: FIREBASE_SENDER_ID
        value: "91256422447"
      - key: FIREBASE_APP_ID
        value: 1:91256422447:web:7a6dfd0ee79f4c276d86da
      - key: FIREBASE_VAPID_KEY
        sync: false
      # TURN / WebRTC (optional)
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
